<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Work Registration</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
  radial-gradient(circle at top left,#7c3aed,#0f172a 40%),
  radial-gradient(circle at bottom right,#06b6d4,#111827 40%);
  padding:20px;
}

.container{
  width:100%;
  max-width:450px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:30px;
  padding:35px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:55px;
  margin-bottom:10px;
}

h2{
  color:#fff;
  text-align:center;
  font-size:30px;
  margin-bottom:8px;
}

.subtitle{
  color:#cbd5e1;
  text-align:center;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:16px;
  margin-bottom:15px;
  border:none;
  outline:none;
  border-radius:15px;
  background:rgba(255,255,255,.08);
  color:white;
  font-size:15px;
}

input::placeholder{
  color:#94a3b8;
}

.checkbox{
  display:flex;
  gap:10px;
  color:#e2e8f0;
  font-size:14px;
  margin:15px 0;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#8b5cf6,#06b6d4);
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-3px);
}

.footer{
  text-align:center;
  color:#94a3b8;
  margin-top:20px;
  font-size:13px;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Online Work Registration</h2>
    <p>Fill your details below.</p>

    <form id="submissionForm">
        <label>Name</label>
        <input type="text" id="inputName" required>

        <label>Phone Number</label>
        <input type="tel" id="inputPhone" required>

        <label>
            <input type="checkbox" required>
            I agree to share my details.
        </label>

        <button type="submit">Register Now</button>
    </form>
</div>

<script>
document.getElementById("submissionForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("inputName").value;
    const phone = document.getElementById("inputPhone").value;

    const message =
`Online Work Registration

Name: ${name}
Phone: ${phone}`;

    const whatsappUrl =
`https://wa.me/918058822912?text=${encodeURIComponent(message)}`;

    window.open(whatsappUrl, "_blank");
});
</script>

</body>
