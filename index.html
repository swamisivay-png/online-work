<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Work Registration</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111827;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}
.container{
    width:90%;
    max-width:400px;
    background:#1f2937;
    padding:25px;
    border-radius:15px;
}
input{
    width:100%;
    padding:12px;
    margin-top:5px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
}
button{
    width:100%;
    padding:12px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
button:hover{
    background:#4338ca;
}
</style>
</head>
<body>

<div class="container">
    <h2>Online Work Registration</h2>
    <p>Fill your details below.</p>

    <form id="submissionForm">
        <label>Name</label>
        <input type="text" id="inputName" required>

        <label>Phone Number</label>
        <input type="tel" id="inputPhone" required>

        <label>
            <input type="checkbox" required>
            I agree to share my details.
        </label>

        <button type="submit">Register Now</button>
    </form>
</div>

<script>
document.getElementById("submissionForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("inputName").value;
    const phone = document.getElementById("inputPhone").value;

    const message =
`Online Work Registration

Name: ${name}
Phone: ${phone}`;

    const whatsappUrl =
`https://wa.me/918058822912?text=${encodeURIComponent(message)}`;

    window.open(whatsappUrl, "_blank");
});
</script>

</body>
